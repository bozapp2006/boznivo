<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boznivo</title>
  <meta name="description" content="Boznivo iOS uygulaması: özellikler, gizlilik ve App Store bağlantısı.">
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Boznivo">
  <meta property="og:title" content="Boznivo">
  <meta property="og:description" content="Sade, hızlı ve gizliliğe saygılı iOS uygulamaları.">
  <meta property="og:image" content="https://boznivo.com/assets/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/assets/images/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="preload" href="/apps.json" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (function () {
      var d = document.documentElement, l;
      d.classList.add('js');
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') d.dataset.theme = t; l = localStorage.getItem('lang'); } catch (e) {}
      if (l !== 'tr' && l !== 'en') l = /^tr\b/i.test(navigator.language || '') ? 'tr' : 'en';
      d.lang = l;
      if (l === 'en') { d.classList.add('i18n-pending'); setTimeout(function () { d.classList.remove('i18n-pending'); }, 2000); }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">İçeriğe geç</a>

  <header class="nav">
    <div class="container nav__inner">
      <a href="/" class="brand" aria-label="Boznivo ana sayfa" data-i18n-attr="aria-label:nav.home">
        <img src="/assets/images/logo.svg" alt="" width="30" height="30">Boznivo
      </a>
      <nav class="nav__links" aria-label="Ana menü" data-i18n-attr="aria-label:nav.menu">
        <a href="/#apps" data-i18n="nav.apps">Uygulamalar</a>
        <a href="/#principles" data-i18n="nav.principles">İlkeler</a>
        <a href="/#about" data-i18n="nav.about">Hakkımda</a>
        <a href="/#faq" data-i18n="nav.faq">SSS</a>
      </nav>
      <div class="nav__actions">
        <button type="button" class="lang-btn" data-lang-toggle><span data-l="tr">TR</span><i>/</i><span data-l="en">EN</span></button>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Temayı değiştir"></button>
        <a href="/#contact" class="btn btn--primary btn--sm nav__cta" data-i18n="nav.cta">İletişime geç</a>
        <button type="button" class="icon-btn nav__menu-btn" data-menu-toggle aria-label="Menüyü aç" aria-expanded="false" aria-controls="mobileMenu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg>
        </button>
      </div>
    </div>
    <nav id="mobileMenu" class="mobile-menu" aria-label="Mobil menü">
      <a href="/#apps" data-i18n="nav.apps">Uygulamalar</a>
      <a href="/#principles" data-i18n="nav.principles">İlkeler</a>
      <a href="/#about" data-i18n="nav.about">Hakkımda</a>
      <a href="/#faq" data-i18n="nav.faq">SSS</a>
      <a href="/#contact" data-i18n="nav.contact">İletişim</a>
    </nav>
  </header>

  <main id="main">
    <div id="appDetail" aria-live="polite">
      <section class="detail-hero">
        <div class="container">
          <div class="skeleton" style="width:116px;height:116px;border-radius:26px;margin-top:68px"></div>
          <div class="skeleton" style="width:min(320px,80%);height:56px;border-radius:14px;margin-top:28px"></div>
          <div class="skeleton" style="width:min(420px,90%);height:22px;border-radius:8px;margin-top:16px"></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__wordmark" aria-hidden="true">boznivo</div>
      <div class="footer__bottom">
        <span>© <span data-year>2026</span> Boznivo. <span data-i18n="footer.rights">Tüm hakları saklıdır.</span></span>
        <span><a href="/privacy.html" data-i18n="footer.privacy">Gizlilik Politikası</a> · <a href="mailto:support@boznivo.com">support@boznivo.com</a></span>
      </div>
    </div>
  </footer>

  <script src="/assets/js/i18n.js" defer></script>
  <script src="/assets/js/common.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</body>
</html>
