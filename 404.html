<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="nf.title">Sayfa bulunamadı — Boznivo</title>
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Boznivo">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="/assets/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Yazı tipleri sayfayı bekletmeden yüklenir; iPhone/Mac'te sistem fontu (SF Pro) kullanılır -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap"></noscript>
  <link rel="stylesheet" href="/assets/css/style.css?v=9">
  <script>
    (function () {
      var d = document.documentElement, l;
      d.classList.add('js');
      try { var t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); } catch (e) {}
      if (t === 'light' || t === 'dark') {
        d.dataset.theme = t;
        // Safari'nin üst/alt çubuk rengi seçilen temayla aynı olsun
        [].forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function (m) { m.media = 'all'; m.content = t === 'dark' ? '#09090b' : '#fbfbfa'; });
      }
      if (l !== 'tr' && l !== 'en') l = /^tr\b/i.test(navigator.language || '') ? 'tr' : 'en';
      d.lang = l;
      if (l === 'en') { d.classList.add('i18n-pending'); setTimeout(function () { d.classList.remove('i18n-pending'); }, 2000); }
    })();
  </script>
</head>
<body>
  <header class="nav">
    <div class="container nav__inner">
      <a href="/" class="brand"><img src="/assets/images/logo.svg" alt="" width="30" height="30">Boznivo</a>
      <div class="nav__actions">
        <button type="button" class="lang-btn" data-lang-toggle><span data-l="tr">TR</span><i>/</i><span data-l="en">EN</span></button>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Temayı değiştir"></button>
      </div>
    </div>
  </header>
  <main class="container notfound">
    <div>
      <div class="notfound__code text-grad">404</div>
      <p data-i18n="nf.text">Aradığınız sayfa bulunamadı ya da taşınmış olabilir.</p>
      <a href="/" class="btn btn--primary" data-i18n="nf.cta">Ana sayfaya dön</a>
    </div>
  </main>
  <script src="/assets/js/i18n.js?v=9" defer></script>
  <script src="/assets/js/common.js?v=9" defer></script>
</body>
</html>
